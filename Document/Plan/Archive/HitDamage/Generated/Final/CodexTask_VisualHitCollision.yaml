v: 1
artifact_role: final_codex_input
codex_input: true
k: generic_plan_compile
g: "현재 VehicleMesh Physics Asset이 받는 HitScan / Projectile 피격을 분리하여, 플레이어에게 보이는 SM_Body StaticMesh가 차량 차체의 무기 피격 표면이 되도록 구현한다"
tf:
  - UE/Config/DefaultEngine.ini
  - UE/Source/CarFight_Re/Public/CFCollisionChannels.h
  - UE/Source/CarFight_Re/Public/CFDamageTypes.h
  - UE/Source/CarFight_Re/Public/CFProjectileActor.h
  - UE/Source/CarFight_Re/Private/CFProjectileActor.cpp
  - UE/Source/CarFight_Re/Public/CFVehiclePawn.h
  - UE/Source/CarFight_Re/Private/CFVehiclePawn.cpp
scope:
  in:
    - 커스텀 Collision Channel과 VehicleVisualHit Profile을 DefaultEngine.ini에 추가한다
    - C++에서 채널 값을 공유하는 CFCollisionChannels.h를 추가한다
    - 차량의 모든 기존 PrimitiveComponent가 WeaponHit / Projectile을 우선 Ignore하도록 설정한다
    - SM_Body만 QueryOnly 상태로 두고 WeaponHit / Projectile을 Block한다
    - VehicleMesh의 기존 Vehicle Profile과 QueryAndPhysics 상태를 변경하지 않는다
    - Dummy HitScan을 ECC_Visibility에서 WeaponHit 채널로 변경한다
    - Projectile CollisionComponent의 Object Type을 Projectile 채널로 변경한다
    - HitScan과 Projectile의 실제 피격 컴포넌트 이름을 FCFDamageHitContext와 VehicleDebug 요약에 기록한다
    - SM_Body StaticMesh의 Simple Collision 누락을 런타임 Warning으로 알린다
    - Unreal Editor 타깃 빌드를 수행한다
  out:
    - StaticMesh Simple Collision 자동 생성
    - .uasset 수정
    - 체력/내구도 컴포넌트
    - BaseDamage 적용
    - 장갑 관통
    - 충격량 적용
    - 차량 파괴
    - 부위별 피해
    - 폭발 범위 피해
    - VFX / SFX
    - 멀티플레이 및 복제
    - 문서 완료 처리
    - Git commit / push
ban:
  - do_not_expand_scope
  - do_not_create_unrequested_files
  - do_not_change_unlisted_public_contracts
  - do_not_treat_review_targets_as_change_targets
  - do_not_mark_success_with_missing_acceptance
  - "실제 HP 감소, Health Component, 파괴 상태를 구현하지 않는다"
  - UCFDamageData의 수치나 구조를 변경하지 않는다
  - Damage 계산 공식을 추가하지 않는다
  - BP_CFVehiclePawn.uasset을 수정하지 않는다
  - "Sedan.Sedan, SUV.SUV 또는 다른 StaticMesh .uasset을 수정하지 않는다"
  - 휠과 터렛을 독립 피격 대상으로 만들지 않는다
  - VehicleMesh의 Physics Asset을 수정하지 않는다
  - 기존 Chaos Vehicle 주행 설정을 변경하지 않는다
  - "기존 Projectile 이동 속도, 반경, 중력, 수명, Pool 정책을 변경하지 않는다"
  - Existing FireFeedback / Reticle 코드를 수정하지 않는다
  - "서버 권한, 복제, 멀티플레이 코드를 추가하지 않는다"
  - Complex Collision을 런타임에 강제로 설정하지 않는다
  - Simple Collision이 없을 때 VehicleMesh로 자동 fallback하지 않는다
  - Git commit 또는 push를 수행하지 않는다
sc:
  acc:
    - a1
    - a2
    - a3
    - a4
    - a5
    - a6
  verify:
    - v1
    - v2
    - v3
    - v4
acc:
  - "DefaultEngine.ini에 WeaponHit, Projectile, VehicleVisualHit 정의가 정확히 한 번 존재한다"
  - CFCollisionChannels.h가 두 채널과 Profile 이름의 단일 C++ 기준을 제공한다
  - VehicleMesh는 기존 QueryAndPhysics / Vehicle 물리 동작을 유지하면서 WeaponHit / Projectile만 Ignore한다
  - SM_Body는 QueryOnly이며 WeaponHit / Projectile을 Block한다
  - Pawn의 다른 PrimitiveComponent는 WeaponHit / Projectile을 Ignore한다
  - Dummy HitScan은 ECC_Visibility가 아니라 WeaponHit을 사용한다
verify:
  - text
  - DefaultEngine.ini에 기존 사용자 Collision Channel이 없던 상태에서 GameTraceChannel1/2만 추가됐는지 확인
  - VehicleMesh의 Profile / CollisionEnabled 변경 코드가 없는지 확인
  - SM_Body만 WeaponHit / Projectile Block인지 확인
fail:
  - acceptance_criteria를 충족하지 못하면 성공이 아니다
  - must_change_targets 검토 없이 수정 파일 0개로 종료하면 재검토가 필요하다
  - 대상 파일 변경 필요성을 확인하지 않고 이미 구현됨으로 종료하면 성공이 아니다
  - failure_reproduction 입력이 남아 있으면 원인 확인 없이 성공 처리하면 안 된다
  - target_files 검토 없이 수정 파일 0개로 종료하면 성공이 아니다
ask_if_missing:
  - "목표, 범위, 검증 조건 중 하나라도 불명확하면 구현하지 말고 missing contract를 보고한다"
ref:
  source: Document/Plan/HitDamage/TaskSource_VisualHitCollision.md
