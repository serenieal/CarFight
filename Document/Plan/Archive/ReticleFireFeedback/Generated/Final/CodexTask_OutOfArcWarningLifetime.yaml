v: 1
artifact_role: final_codex_input
codex_input: true
k: generic_plan_compile
g: "Text_OutOfArcWarning을 WBP에 추가했을 때 조준각 경고가 정해진 유지 시간 동안 한 곳에만 표시되고, 유지 시간이 끝나면 완전히 사라지도록 수정한다"
tf:
  - UE/Source/CarFight_Re/Private/CFVehiclePawn.cpp
  - UE/Source/CarFight_Re/Private/UI/CFAimReticleWidget.cpp
scope:
  in:
    - CFVehiclePawn.cpp에서 bShowOutOfArcWarning 표시 종료 조건 수정
    - CFAimReticleWidget.cpp에서 전용 OutOfArc 경고의 중복 표시 방지와 fallback 처리
    - "두 파일의 Version, Changelog, Migration 갱신"
    - Unreal Editor 타깃 빌드 확인
  out:
    - OutOfArc 판정 방식과 조준각 계산 변경
    - 새로운 경고 지속시간 프로퍼티 추가
    - "위젯 배치, 폰트, 색상 기본값 변경"
    - 헤더 또는 FireFeedback 타입 구조 변경
    - .uasset 자동 수정
    - 문서 현행화
    - Git commit 또는 push
ban:
  - do_not_expand_scope
  - do_not_create_unrequested_files
  - do_not_change_unlisted_public_contracts
  - do_not_treat_review_targets_as_change_targets
  - do_not_mark_success_with_missing_acceptance
  - 헤더 파일과 WBP_AimReticle.uasset은 수정하지 않는다
  - "발사 판정, RejectReason 선택, 피드백 지속시간 값, 쿨다운 계산을 변경하지 않는다"
  - 기존 FireSuccess → Cooldown → 종료 동작을 변경하지 않는다
  - 다른 RejectReason 분기의 동작을 변경하지 않는다
  - 기존 공개 함수 시그니처를 변경하지 않는다
  - 새로운 위젯 바인딩이나 UPROPERTY를 추가하지 않는다
  - Git commit 또는 push를 수행하지 않는다
sc:
  acc:
    - a_target_review
    - a2
    - a3
    - a4
    - a5
    - a6
  verify:
    - v1
    - v2
    - v3
    - v4
acc:
  - 수정 파일은 CFVehiclePawn.cpp와 CFAimReticleWidget.cpp 두 개뿐이다
  - "OutOfWeaponArc 발생 직후 유지 시간 안에서는 bFeedbackActive == true, bShowOutOfArcWarning == true다"
  - "유지 시간이 끝나면 bFeedbackActive == false, bShowOutOfArcWarning == false다"
  - bOverrideReticleState == false 정책은 유지된다
  - "FeedbackDisplayKey는 유지 시간 안에서만 OutOfArcWarning, 이후 NAME_None인 기존 동작을 유지한다"
  - Text_OutOfArcWarning이 바인딩되면 전용 문구만 표시되고 State/Hint에는 같은 경고가 중복되지 않는다
verify:
  - 이번 작업 diff에서 대상 두 cpp 파일 외 파일을 수정하지 않았는지 확인한다
  - Pawn의 bShowOutOfArcWarning이 bWithinRejectedFeedbackTime을 따르는지 확인한다
  - 전용 경고 위젯 존재 여부에 따른 중복 방지/fallback 분기가 명확한지 확인한다
  - GetMainReticleColor()의 OutOfArcWarning 비덮어쓰기 정책이 유지되는지 확인한다
fail:
  - acceptance_criteria를 충족하지 못하면 성공이 아니다
  - must_change_targets 검토 없이 수정 파일 0개로 종료하면 재검토가 필요하다
  - 대상 파일 변경 필요성을 확인하지 않고 이미 구현됨으로 종료하면 성공이 아니다
  - failure_reproduction 입력이 남아 있으면 원인 확인 없이 성공 처리하면 안 된다
  - target_files 검토 없이 수정 파일 0개로 종료하면 성공이 아니다
ask_if_missing:
  - "목표, 범위, 검증 조건 중 하나라도 불명확하면 구현하지 말고 missing contract를 보고한다"
