v: 1
artifact_role: final_codex_input
codex_input: true
k: generic_plan_compile
g: Finalize CFServerLauncher v1.0 after the v1.0.0-rc1 release-candidate checks passed manually
tf:
  - Tools/CFServerLauncher/src/CFServerLauncher/ViewModels/MainViewModel.cs
  - Tools/CFServerLauncher/Docs/release.md
  - Tools/CFServerLauncher/publish.ps1
scope:
  in:
    - "Change the UI version text from:"
    - "text 버전: v1.0.0-rc1"
    - "text 버전: v1.0.0"
    - Keep the property name AppVersionText unchanged
    - text Tools/CFServerLauncher/publish.ps1
    - "The script should publish the WPF app to:"
    - text Tools/CFServerLauncher/Publish
    - powershell dotnet publish .\src\CFServerLauncher\CFServerLauncher.csproj -c Release -r win-x64 --self-contained false -o .\Publish
    - It should run from Tools/CFServerLauncher
    - "It should set $ErrorActionPreference = \"Stop\""
    - It should create or refresh the Publish folder
    - It should print Korean progress messages
    - "It should not delete Server, Config, or Logs folders"
    - It should not copy server build files automatically
    - It should not require administrator permission
    - text Tools/CFServerLauncher/Docs/release.md
    - Version should be v1.0.0 instead of v1.0.0-rc1
    - Document the new publish.ps1 usage
    - Keep direct dotnet publish command as fallback
    - Add final release verification checklist
    - Mention that Server build files are not bundled automatically by the launcher publish script
  out:
    - text profile system auto restart RCON web dashboard Unreal build automation Cook/Stage automation CPU/memory/TPS monitoring server player list game internal admin command server build file packaging installer creation
ban:
  - do_not_expand_scope
  - do_not_create_unrequested_files
  - do_not_change_unlisted_public_contracts
  - do_not_treat_review_targets_as_change_targets
  - do_not_mark_success_with_missing_acceptance
  - Do not add third-party NuGet packages
  - Do not change Unreal server code
  - "Do not add Unreal build, Cook, Stage, RCON, web dashboard, profile system, auto restart, or process monitoring"
sc:
  acc:
    - a1
    - a2
    - a3
    - a4
    - a5
    - a6
  verify:
    - v1
acc:
  - dotnet build .\Tools\CFServerLauncher\CFServerLauncher.sln succeeds
  - "App window shows 버전: v1.0.0"
  - Existing start/stop/restart behavior still works
  - Existing close-confirmation behavior still works
  - Tools\CFServerLauncher\publish.ps1 exists
  - Docs\release.md documents both publish.ps1 and direct dotnet publish fallback
verify:
  - "powershell cd D:\\Work\\CarFight_git dotnet build .\\Tools\\CFServerLauncher\\CFServerLauncher.sln dotnet run --project .\\Tools\\CFServerLauncher\\src\\CFServerLauncher\\CFServerLauncher.csproj"
fail:
  - acceptance_criteria를 충족하지 못하면 성공이 아니다
  - must_change_targets 검토 없이 수정 파일 0개로 종료하면 재검토가 필요하다
  - 대상 파일 변경 필요성을 확인하지 않고 이미 구현됨으로 종료하면 성공이 아니다
  - failure_reproduction 입력이 남아 있으면 원인 확인 없이 성공 처리하면 안 된다
  - target_files 검토 없이 수정 파일 0개로 종료하면 성공이 아니다
ask_if_missing:
  - "목표, 범위, 검증 조건 중 하나라도 불명확하면 구현하지 말고 missing contract를 보고한다"
